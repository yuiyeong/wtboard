[package]
name = "wtboard-app"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
wtboard-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
